<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>个人工作台</title>
<meta name="description" content="WorkBuddy 双端个人操作面板：实时同步本机 skills / 模型 / 自动化 / 知识库真实数据，聚合 AI 日报与每日新闻，含速记、课程表与功能自检。">
<meta property="og:title" content="个人工作台">
<meta property="og:description" content="WorkBuddy 双端面板，自动同步本机真实数据，聚合 AI 日报与每日新闻。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<header class="header">
  <div>
    <h1>🛠️ 个人工作台</h1>
    <div class="sub">WorkBuddy 双端面板 · 自动同步本机真实数据</div>
  </div>
  <div class="snap-wrap">
    <div class="snap" id="snap">📸 快照 · 加载中…</div>
    <div class="sync-status" id="syncStatus">🔄 同步状态 · 加载中…</div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">🔄 立即刷新</button>
    <button class="refresh-btn" id="selfCheckBtn" onclick="selfCheck()">🔍 功能自检</button>
    <span class="next-sync" id="nextSync">下次同步 · -</span>
    <button class="refresh-btn" id="themeBtn" onclick="toggleTheme()" title="切换深色 / 浅色">🌙</button>
  </div>
</header>
<div class="selfcheck" id="selfCheckResult"></div>
<main class="container" id="main">
  <section class="kpis" id="kpis"></section>
  <div class="searchbar">
  <span class="si">🔍</span>
  <input id="q" placeholder="搜 skill 名称 / 描述，快速定位…" oninput="filt()">
</div>
  <section class="quickbar">
    <div class="qb-title">⚡ 快捷启动台 · 高频动作一键直达</div>
    <div class="qb-grid" id="quickbar"></div>
  </section>
  <section class="card links-card">
    <h2><span class="ic">🔗</span>常用入口 · 一键直达</h2>
    <div class="links-grid" id="linksGrid"></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn-sm" onclick="addLink()">➕ 加一个</button>
      <span id="linksHint" class="empty"></span>
    </div>
  </section>
  <section class="card todos-card">
    <h2><span class="ic">✅</span>待办清单 · 可勾选</h2>
    <div class="todo-prog" id="todoProg"></div>
    <ul class="todos" id="todosList"></ul>
    <textarea id="todoInput" rows="2" placeholder="写一条待办，回车或点“添加”（仅存本机，勾上即完成）"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
      <button class="btn-sm" onclick="addTodo()">➕ 添加</button>
      <button class="btn-sm" onclick="clearDone()">🧹 清除已完成</button>
      <span id="todosHint" class="empty"></span>
    </div>
  </section>
  <section class="card notes-card">
    <h2><span class="ic">📝</span>我的速记 · 仅存本机</h2>
    <textarea id="noteInput" rows="2" placeholder="记一笔待办 / 想法，回车或点“添加”（只存在你浏览器，不上传）"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
      <button class="btn-sm" onclick="addNote()">➕ 添加</button>
      <span id="notesHint" class="empty"></span>
    </div>
    <ul class="notes" id="notesList"></ul>
  </section>
  <section class="card wk-card">
    <h2><span class="ic">📅</span>本周动态 · 近期变化</h2>
    <ul class="wk-list" id="wkList"></ul>
  </section>
  <nav class="tabs">
    <button class="tab active" data-tab="cap" onclick="switchTab('cap')">🚀 能力速达</button>
    <button class="tab" data-tab="news" onclick="switchTab('news')">🗞️ AI 日报<span class="tab-dot" id="newsDot"></span></button>
    <button class="tab" data-tab="dnews" onclick="switchTab('dnews')">📰 每日新闻<span class="tab-dot" id="dnewsDot"></span></button>
    <button class="tab" data-tab="ov" onclick="switchTab('ov')">📊 总览状态</button>
    <button class="tab" data-tab="schedule" onclick="switchTab('schedule')">📅 课程表</button>
  </nav>
  <section class="tabpane active" id="pane-cap">
    <div class="wrap"><div class="col" id="col-cap"></div></div>
  </section>
  <section class="tabpane" id="pane-news">
    <div class="wrap"><div class="col" id="col-news"></div></div>
  </section>
  <section class="tabpane" id="pane-dnews">
    <div class="wrap"><div class="col" id="col-dnews"></div></div>
  </section>
  <section class="tabpane" id="pane-ov">
    <div class="wrap"><div class="col" id="col-ov"></div></div>
  </section>
  <section class="tabpane" id="pane-schedule">
    <div class="wrap"><div class="col" id="col-schedule"></div></div>
  </section>
</main>
<div class="foot">本机数据每小时自动同步 · AI 日报与每日新闻自动抓取 · 全部用真实数据动态生成</div>
<div class="heat-modal" id="heat-detail" onclick="if(event.target===this)closeHeat()">
  <div class="heat-card">
    <div class="heat-card-h"><span id="heat-detail-date"></span><button class="heat-x" onclick="closeHeat()">✕</button></div>
    <div class="heat-card-b" id="heat-detail-body"></div>
  </div>
</div>
<script src="app.js?v=21"></script>
</body>
</html>
