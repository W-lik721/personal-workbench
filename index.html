<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>个人工作台</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28" />
      <span>个人工作台</span>
    </div>
    <button id="installBtn" class="install-btn" hidden>安装到主屏幕</button>
  </header>

  <section class="kpi-bar" id="kpiBar" aria-label="关键指标"></section>

  <main class="layout">
    <section class="col-main">
      <h2 class="section-title">能力速达</h2>
      <div class="cards" id="skillCards"></div>

      <h2 class="section-title">今日引导</h2>
      <ul class="guide" id="guideList"></ul>
    </section>

    <aside class="col-side">
      <h2 class="section-title">状态看板</h2>
      <div id="statusBoard"></div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
