name: Fetch AI Daily (self-hosted)

on:
  schedule:
    # 每天 UTC 00:30 ≈ 北京 08:30
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  daily:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run daily AI update
        env:
          PYTHONIOENCODING: utf-8
        run: C:\Users\13115\.workbuddy\binaries\python\versions\3.13.12\python.exe daily_ai.py
        shell: cmd
        working-directory: ${{ github.workspace }}

      # workflow 用 GITHUB_TOKEN 推送不会触发新的 Pages 部署 workflow，
      # 所以推送完成后主动请求 GitHub Pages 重建。
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'curl --ssl-no-revoke -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"'
        shell: cmd
