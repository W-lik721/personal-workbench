name: Sync Workbench Data (self-hosted)

on:
  schedule:
    # 每小时第 13 分（UTC）。由本机 self-hosted runner 实际执行。
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run sync (生成 data.json 并推送)
        env:
          PYTHONIOENCODING: utf-8
        run: C:\Users\13115\.workbuddy\binaries\python\versions\3.13.12\python.exe sync.py
        shell: cmd
        working-directory: ${{ github.workspace }}

      # workflow 用 GITHUB_TOKEN 推送不会触发新的 Pages 部署 workflow，
      # 所以同步完成后主动请求 GitHub Pages 重建。
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -X POST -H "Authorization: token %GH_TOKEN%" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
        shell: cmd
