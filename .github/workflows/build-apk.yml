name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'twa-manifest.json'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore workbench.keystore -alias workbench \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass workbench-pass -keypass workbench-pass \
            -dname "CN=Qingdeng, OU=Personal, O=Personal, L=Fuzhou, ST=Fujian, C=CN"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Sign APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks workbench.keystore \
            --ks-key-alias workbench \
            --ks-pass pass:workbench-pass \
            --key-pass pass:workbench-pass \
            --out workbench-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          ls -la workbench-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-apk
          path: workbench-signed.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 工作台 APK v${{ github.run_number }}
          files: workbench-signed.apk
          generate_release_notes: false
